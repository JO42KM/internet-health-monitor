services:
  database:
    image: timescale/timescaledb:latest-pg17
    container_name: internet-health-database
    restart: unless-stopped

    environment:
      POSTGRES_DB: internet_health
      POSTGRES_USER: ihm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihm_user -d internet_health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: